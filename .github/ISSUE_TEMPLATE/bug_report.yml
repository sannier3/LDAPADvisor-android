name: Bug report
description: Report a problem with LDAPADvisor Android
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Never include passwords, credentials, private certificates, or production Active Directory data.**

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What went wrong?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior. Sanitize all hostnames, IPs, and identities.
      placeholder: |
        1. Open ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android version
      placeholder: e.g. 14
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device manufacturer / model
      placeholder: e.g. Google Pixel 8
    validations:
      required: false

  - type: input
    id: app_version
    attributes:
      label: LDAPADvisor version
      description: App version name/code, commit SHA, or build identifier if known.
      placeholder: e.g. 1.0 (debug) / commit abc1234
    validations:
      required: false

  - type: dropdown
    id: server_type
    attributes:
      label: Directory server type
      options:
        - Microsoft Active Directory
        - OpenLDAP
        - 389 Directory Server
        - Samba AD DC
        - Other LDAP server
        - Unknown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste relevant logs with all secrets and internal identifiers removed.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that may help diagnose the issue.
    validations:
      required: false

  - type: checkboxes
    id: sanitization
    attributes:
      label: Sensitive data confirmation
      options:
        - label: I have removed passwords, credentials, internal domain names, IP addresses and other sensitive information from the report.
          required: true
